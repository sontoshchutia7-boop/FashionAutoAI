name: Build FashionAutoAI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir -p app_source
          unzip -q FashionAutoAI_MVP_0.1.zip -d app_source

      - name: Find Android project
        run: |
          echo "Searching for Gradle project..."
          find app_source -name gradlew -type f

      - name: Make Gradle executable
        run: |
          GRADLEW=$(find app_source -name gradlew -type f | head -1)
          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found"
            exit 1
          fi
          chmod +x "$GRADLEW"

      - name: Build APK
        run: |
          GRADLEW=$(find app_source -name gradlew -type f | head -1)
          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW")
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FashionAutoAI-debug
          path: app_source/**/build/outputs/apk/debug/*.apk
