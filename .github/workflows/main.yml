name: Build FashionAutoAI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir -p app_source
          unzip -o FashionAutoAI_MVP_0.1.zip -d app_source

      - name: Find Android project
        run: |
          find app_source -name gradlew -type f

      - name: Make Gradle executable
        run: |
          chmod +x $(find app_source -name gradlew -type f | head -1)

      - name: Build APK
        run: |
          GRADLEW=$(find app_source -name gradlew -type f | head -1)
          cd "$(dirname "$GRADLEW")"
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FashionAutoAI-debug-APK
          path: app_source/**/build/outputs/apk/**/*.apk
